# Claims ledger (DEP&CC 2.0, Chapters 5.4, 5.5, 23.7, 27; Law 12: no claim inflation).
# Status vocabularies are closed sets; dep_lint enforces membership and
# contamination. Claim statuses used here: machine-checked, conjectural,
# empirical. Completeness statuses: complete, placeholder.

results:
  - id: res.energy_nonneg
    node: IGTP.geodesicEnergy_nonneg
    type: theorem
    statement: "For every path γ and velocity assignment v, the geodesic energy density E(γ, v, t) = (1/2) g_{γ(t)}(v(t), v(t)) is nonnegative."
    claim_status: machine-checked
    completeness: complete
    class: DEP-0
    hyp: [H1]
    quantifiers: "A A A (γ, v, t)"
    depends: []
    axioms: [propext, Classical.choice, Quot.sound]
    constants: []
    interchange: []
    witness: IGTP.instMetricManifoldUnit
    sharpness: "H1: sharp (battery probes dg.energy with negative u: g(v,v) = u^2 < 0 fails; conclusion fails)"
    degeneracy: dep/out/degeneracy/IGTP.geodesicEnergy_nonneg.json
    fidelity: dep/fidelity/res.energy_nonneg.yaml
    evidence: "IGTP/Manifold.lean; axiom dump dep/out/axioms/IGTP.geodesicEnergy_nonneg.json"
    gap: none
    owner: compilecomp
    review: {date: "2026-11-07", reviewer: compilecomp, cold_read: "self-review; independent cold read scheduled per dep/manifest.yaml"}

  - id: res.action_nonneg
    node: IGTP.discreteAction_nonneg
    type: theorem
    statement: "The discrete action S(γ, ts), the sum over a finite time list of E + V + K, is nonnegative whenever V and K are nonnegative componentwise."
    claim_status: machine-checked
    completeness: complete
    class: DEP-0
    hyp: [H1, H2]
    quantifiers: "A A A (o, γ, ts)"
    depends: [res.energy_nonneg]
    axioms: [propext, Classical.choice, Quot.sound]
    constants: []
    interchange: []
    witness: IGTP.unitObjective
    sharpness: "H1: sharp (battery dg.action.14); H2: sharp (battery dg.action.15)"
    degeneracy: dep/out/degeneracy/IGTP.discreteAction_nonneg.json
    fidelity: dep/fidelity/res.action_nonneg.yaml
    evidence: "IGTP/Objective.lean; axiom dump dep/out/axioms/IGTP.discreteAction_nonneg.json"
    gap: none
    owner: compilecomp
    review: {date: "2026-11-07", reviewer: compilecomp, cold_read: "self-review; independent cold read scheduled per dep/manifest.yaml"}

  - id: res.ricci_const
    node: IGTP.isRicciFlow_const
    type: theorem
    statement: "A time-constant metric family satisfies the Ricci-flow equation ∂_t g = -2 R if and only if the declared Ricci data vanishes identically."
    claim_status: machine-checked
    completeness: complete
    class: DEP-0
    hyp: []
    quantifiers: "A (g) then A (p, u, v) in each direction"
    depends: []
    axioms: [propext, Classical.choice, Quot.sound]
    constants: []
    interchange: []
    witness: "zero family on Unit (example after isRicciFlow_const in IGTP/RicciFlow.lean)"
    sharpness: "no hypotheses; statement is an iff with both directions proved"
    degeneracy: dep/out/degeneracy/IGTP.isRicciFlow_const.json
    fidelity: dep/fidelity/res.ricci_const.yaml
    evidence: "IGTP/RicciFlow.lean; axiom dump dep/out/axioms/IGTP.isRicciFlow_const.json"
    gap: none
    owner: compilecomp
    review: {date: "2026-11-07", reviewer: compilecomp, cold_read: "self-review; independent cold read scheduled per dep/manifest.yaml"}

  - id: res.descent_strict
    node: IGTP.quadratic_descent_strict
    type: theorem
    statement: "For c > 0, f > 0, η > 0 with η c ≤ f, and θ ≠ 0, the natural-gradient update θ' = θ - η (c θ)/f strictly decreases the quadratic objective S(θ) = (c/2) θ²."
    claim_status: machine-checked
    completeness: complete
    class: DEP-0
    hyp: [H1, H2, H3, H4, H5]
    quantifiers: "A A A A A (c, f, η, θ; all universally quantified with the stated domains)"
    depends: []
    axioms: [propext, Classical.choice, Quot.sound]
    constants: [const.eta, const.c, const.f]
    interchange: []
    witness: "exact rational instance c = 1, f = 1, η = 1/2, θ = 1 (example in IGTP/QuadraticModel.lean)"
    sharpness: "H1: sharp (c = 0 gives equality, battery dg.quadratic_descent_strict); H2: sharp (f = 0 ill-posed); H3: sharp (η = 0 gives equality); H4: sharp (η c > 2 f increases S, battery sharp probe); H5: sharp (θ = 0 gives equality)"
    degeneracy: dep/out/degeneracy/IGTP.quadratic_descent_strict.json
    fidelity: dep/fidelity/res.descent_strict.yaml
    evidence: "IGTP/QuadraticModel.lean; axiom dump dep/out/axioms/IGTP.quadratic_descent_strict.json"
    gap: none
    owner: compilecomp
    review: {date: "2026-11-07", reviewer: compilecomp, cold_read: "self-review; independent cold read scheduled per dep/manifest.yaml"}

  - id: res.descent_le
    node: IGTP.quadratic_descent_le
    type: theorem
    statement: "For c > 0, f > 0, η ≥ 0 with η c ≤ f, the update never increases the quadratic objective, for every θ."
    claim_status: machine-checked
    completeness: complete
    class: DEP-0
    hyp: [H1, H2, H3, H4]
    quantifiers: "A A A A (c, f, η, θ)"
    depends: []
    axioms: [propext, Classical.choice, Quot.sound]
    constants: [const.eta, const.c, const.f]
    interchange: []
    witness: "θ = 0 instance: equality holds (battery dg.quadratic_descent_le.zero)"
    sharpness: "H4: sharp (η c > 2 f increases S); H3: sharp (η < 0 increases S for θ ≠ 0)"
    degeneracy: dep/out/degeneracy/IGTP.quadratic_descent_le.json
    fidelity: dep/fidelity/res.descent_le.yaml
    evidence: "IGTP/QuadraticModel.lean; axiom dump dep/out/axioms/IGTP.quadratic_descent_le.json"
    gap: none
    owner: compilecomp
    review: {date: "2026-11-07", reviewer: compilecomp, cold_read: "self-review; independent cold read scheduled per dep/manifest.yaml"}

