empirical:
  - id: emp.resolution_engine
    statement: "The propositional resolution engine decides entailment on the test battery, and every produced derivation passes the clause-level soundness criterion."
    claim_status: empirical
    completeness: complete
    class: DEP-1
    depends: []
    gap: none
    owner: compilecomp
    evidence: "bridges/tests/test_resolution.py; CI run"
    notes: "exploratory; no pre-registration; soundness of the engine itself is not formally verified"
  - id: emp.smt_crosscheck
    statement: "z3 at the pinned version agrees with the resolution engine on every task of the reference pipeline."
    claim_status: empirical
    completeness: complete
    class: DEP-1
    depends: []
    gap: none
    owner: compilecomp
    evidence: "bridges/tests/test_smt_bridge.py; experiments/results/demo_golden.json"
    notes: "z3 verdicts are a TCB cross-check, never the sole justification of a claim"
  - id: emp.search_energy
    statement: "Geodesic search returns the minimum combined-energy path on the demo manifold, matching hand-computed exact optima."
    claim_status: empirical
    completeness: complete
    class: DEP-1
    depends: []
    gap: none
    owner: compilecomp
    evidence: "bridges/tests/test_search.py; experiments/results/demo_golden.json"
    notes: "exact rational arithmetic; no floating point enters the energies"
  - id: emp.pipeline_determinism
    statement: "Identical pipeline runs produce byte-identical records except wall-clock timings, which are informational."
    claim_status: empirical
    completeness: complete
    class: DEP-1
    depends: []
    gap: none
    owner: compilecomp
    evidence: "bridges/tests/test_determinism.py; experiments/code/run_demo.py golden comparison"

