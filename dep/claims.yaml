  - id: res.anchors_exist
    node: IGTP.exists_path_satisfies_anchors
    type: theorem
    statement: "Every consistent, nonempty-universe anchor set is satisfied by some path."
    claim_status: machine-checked
    completeness: complete
    class: DEP-0
    hyp: [H1, H2]
    quantifiers: "A (A) E (γ): for every consistent anchor set there exists a satisfying path"
